[project]
name = "temporal-k8s-operator"
version = "0.0"
requires-python = ">=3.10,<3.13"

[tool.bandit]
exclude_dirs = ["/venv/"]

[tool.bandit.assert_used]
skips = ["*/*test.py", "*/test_*.py", "*tests/*.py"]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Formatting and linting tools configuration
[tool.ruff]
preview = true
target-version = "py310"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    "A",
    "E",
    "W",
    "F",
    "C",
    "N",
    "D",
    "I",
    "B",
    "CPY001",
    "RUF",
    "UP",
]
ignore = [
    "D107",  # Missing docstring in __init__
    "D417",  # Missing argument descriptions (not required for self/cls)
    "E501",  # Line too long
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1", "D417", "S"]

[tool.ruff.lint.isort]
known-first-party = ["helpers", "conftest", "temporal_client"]

[tool.ruff.lint.flake8-copyright]
author = "Canonical Ltd."
notice-rgx = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.optional-dependencies]
# Runtime deps baked into the charm
charm = [
    "cryptography==45.0.3",
    "Jinja2==3.1.4",
    "ops==2.21.1",
    "async-timeout==4.0.3",
    "pydantic>=2.0",  # traefik-k8s ingress, tls-certificates requirement
    "boto3==1.34.31",
    "cosl==0.0.51",
    "requests==2.31.0",
    "openfga-sdk==0.6.0",
]

# Unit test deps
unit = [
    "coverage[toml]==7.5.0",
    "pytest==7.1.3",
    "ipdb==0.13.9",
    "cryptography==45.0.3",
    "cosl==0.0.51",
    "requests==2.31.0",
    "openfga-sdk==0.6.0",
    "ops[testing]==2.21.1",
    "Jinja2==3.1.4",
    "boto3==1.34.31",
]

# Integration test deps
integration = [
    "pytest==7.1.3",
    "pytest-operator==0.31.1",
    "pytest-asyncio==0.21",
    "jubilant~=1.0",
    "juju==3.5.2.1",
    "temporalio==1.7.0",
    "grpcio==1.73.1",
    "grpcio-health-checking==1.73.1",
    "ipdb==0.13.9",
    "ops==2.21.1",
    "tenacity>=8.2.0,<10",
]

# Static analysis / linting
lint = [
    "codespell==2.2.5",
    "ruff>=0.8.0",
]

# Formatting
fmt = [
    "ruff>=0.8.0",
]

dev = [
  "temporal-k8s-operator[charm,unit,integration,lint,fmt]",
]
