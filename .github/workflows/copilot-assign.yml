name: Assign issue to Copilot coding agent

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  assign-copilot:
    if: github.event.label.name == 'needs-copilot'
    runs-on: ubuntu-latest
    steps:
      - name: Assign to Copilot
        run: gh issue edit "${{ github.event.issue.number }}" --add-assignee "Copilot" --repo "${{ github.repository }}"
        env:
          # GITHUB_TOKEN (github-actions[bot]) has no Copilot seat and is silently
          # dropped by the assignees API. Use a user PAT from an account that holds
          # the Copilot seat instead.
          GH_TOKEN: ${{ secrets.GH_PAT }}
