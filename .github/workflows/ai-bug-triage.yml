name: AI Bug Triaging

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze (leave empty to analyze all open issues)'
        required: false
        type: string

permissions:
  issues: write
  contents: read
  models: read

jobs:
  list-issues:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_issues: ${{ steps.build-matrix.outputs.has_issues }}
    steps:
      - name: Build issue matrix
        id: build-matrix
        uses: actions/github-script@v7
        with:
          script: |
            let issueNumbers = [];

            if (context.eventName === 'issues') {
              issueNumbers = [context.payload.issue.number];
            } else {
              const rawInput = '${{ github.event.inputs.issue_number }}'.replace(/\D/g, '');
              if (rawInput) {
                issueNumbers = [parseInt(rawInput, 10)];
              } else {
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100
                });
                // Exclude pull requests (GitHub returns them in issues list)
                issueNumbers = issues
                  .filter(i => !i.pull_request)
                  .map(i => i.number);
              }
            }

            core.setOutput('matrix', JSON.stringify({ issue: issueNumbers }));
            core.setOutput('has_issues', issueNumbers.length > 0 ? 'true' : 'false');
            console.log(`Issues to analyze: ${issueNumbers}`);

  analyze-issue:
    needs: list-issues
    if: needs.list-issues.outputs.has_issues == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.list-issues.outputs.matrix) }}
      fail-fast: false
      max-parallel: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Repository Context
        id: load_context
        run: |
          [ -f .github/ai-context/TRIAGING_RULES.md ] || { echo "❌ TRIAGING_RULES.md not found"; exit 1; }
          [ -f .github/ai-context/REPO_PATTERNS.md ]  || { echo "❌ REPO_PATTERNS.md not found"; exit 1; }
          {
            echo "rules<<EOF"
            cat .github/ai-context/TRIAGING_RULES.md
            echo "EOF"
            echo "patterns<<EOF"
            cat .github/ai-context/REPO_PATTERNS.md
            echo "EOF"
            echo "history<<EOF"
            cat .github/ai-context/DECISION_HISTORY.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch and Analyze Issue
        id: analyze
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT_RULES: ${{ steps.load_context.outputs.rules }}
          CONTEXT_PATTERNS: ${{ steps.load_context.outputs.patterns }}
          CONTEXT_HISTORY: ${{ steps.load_context.outputs.history }}
        with:
          script: |
            const issueNumber = ${{ matrix.issue }};

            // Fetch issue data from the API so user content never gets
            // interpolated directly into JS (avoids backtick/quote injection).
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const issueTitle = issue.title;
            const issueBody = issue.body || 'No description provided';
            const existingLabels = issue.labels.map(l => l.name);

            // GitHub Models caps gpt-4o at 8000 tokens (~32000 chars).
            // Truncate each variable-length section so the total stays safe.
            const truncate = (text, maxChars) =>
              text.length > maxChars ? text.slice(0, maxChars) + '\n... [truncated]' : text;

            const prompt = [
              'You are analyzing a bug for the Temporal Kubernetes Operator repository.',
              'Use the following repository-specific context to inform your analysis:',
              '',
              '=== REPOSITORY TRIAGING RULES ===',
              truncate(process.env.CONTEXT_RULES, 6000),
              '',
              '=== HISTORICAL PATTERNS ===',
              truncate(process.env.CONTEXT_PATTERNS, 6000),
              '',
              '=== PAST TEAM CORRECTIONS ===',
              process.env.CONTEXT_HISTORY,
              '',
              '=== NEW ISSUE TO ANALYZE ===',
              `Title: ${issueTitle}`,
              `Body: ${truncate(issueBody, 3000)}`,
              `Existing Labels: ${existingLabels.join(', ')}`,
              '',
              'Analyze this issue and respond ONLY with valid JSON (no markdown, no preamble):',
              '{',
              '  "complexity": "trivial|low|medium|high|critical",',
              '  "confidence": "high|medium|low",',
              '  "auto_resolve_eligible": true|false,',
              '  "risk_level": "low|medium|high",',
              '  "summary": "2-3 sentence plain-language summary of what the issue is about",',
              '  "time_estimate_pulses": <number, where 1 pulse = 2 weeks. Use 0.25 for a few hours, 0.5 for ~1 week, 1 for a full sprint, etc.>,',
              '  "steps_to_reproduce": "present|missing|not_applicable (not_applicable for docs, feature requests, or issues where reproduction steps are irrelevant)",',
              '  "severity": {',
              '    "affects_db": true|false,',
              '    "affects_integrations": true|false,',
              '    "causes_error_state": true|false,',
              '    "affects_workload": true|false (true if the Temporal workload itself fails core operations: scheduling workflows, running workers, executing activities, or processing signals/timers),',
              '    "has_workaround": true|false,',
              '    "level": "derive strictly from the factors using this priority order: (1) critical = (affects_db OR causes_error_state OR affects_workload) AND NOT has_workaround; (2) high = (affects_db OR causes_error_state OR affects_workload) AND has_workaround, OR (affects_integrations only) AND NOT has_workaround; (3) medium = affects_integrations only AND has_workaround; (4) low = no factors true. affects_db, causes_error_state, and affects_workload always produce at minimum high regardless of workaround."',
              '  },',
              '  "similar_patterns": ["patterns from REPO_PATTERNS.md that match"],',
              '  "affected_areas": ["predicted files or components"]',
              '}'
            ].join('\n');

            // GitHub Models — OpenAI-compatible endpoint authenticated with GITHUB_TOKEN.
            // No extra secrets required; the token is provided automatically by Actions.
            const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
              },
              body: JSON.stringify({
                model: 'gpt-4o',
                max_tokens: 2000,
                response_format: { type: 'json_object' },
                messages: [
                  { role: 'system', content: 'You are a bug triaging assistant. You respond only with valid JSON.' },
                  { role: 'user', content: prompt }
                ]
              })
            });

            if (!response.ok) {
              const error = await response.text();
              core.setFailed(`API call failed: ${error}`);
              return;
            }

            const data = await response.json();
            const analysisText = data.choices[0].message.content;
            const cleanJson = analysisText.replace(/```json\n?|\n?```/g, '').trim();
            const analysis = JSON.parse(cleanJson);

            core.setOutput('analysis_b64', Buffer.from(JSON.stringify(analysis)).toString('base64'));
            console.log(`Issue #${issueNumber} analysis complete:`, analysis);
            return analysis;

      - name: Apply Labels and Post Comment
        uses: actions/github-script@v7
        env:
          ANALYSIS_B64: ${{ steps.analyze.outputs.analysis_b64 }}
        with:
          script: |
            const analysis = JSON.parse(Buffer.from(process.env.ANALYSIS_B64, 'base64').toString());
            const issueNumber = ${{ matrix.issue }};

            const labels = ['needs-human-review'];
            if (analysis.severity?.level === 'critical') labels.push('severity:critical');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels
            });

            // Idempotent comment: update existing AI analysis comment if one exists,
            // otherwise create a new one. Prevents duplicate comments on re-runs.
            const MARKER = '<!-- ai-triage-analysis -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const existing = comments.find(c => c.body.includes(MARKER));

            const confidenceRange = analysis.confidence === 'high' ? '90%+' : analysis.confidence === 'medium' ? '60-90%' : '<60%';
            const patternsMatched = analysis.similar_patterns.length > 0
              ? analysis.similar_patterns.map(p => `- ${p}`).join('\n')
              : '- No exact pattern match (new pattern type)';
            const affectedAreas = analysis.affected_areas.map(a => `- \`${a}\``).join('\n');

            const pulses = analysis.time_estimate_pulses;
            const pulseLabel = pulses < 1 ? `${pulses} pulses (~${Math.round(pulses * 2)} week${pulses * 2 === 1 ? '' : 's'})` : `${pulses} pulse${pulses === 1 ? '' : 's'} (~${pulses * 2} weeks)`;

            const sev = analysis.severity;
            const severityLines = [
              `**Severity:** ${sev.level}`,
              `- Affects database: ${sev.affects_db ? 'Yes' : 'No'}`,
              `- Affects integrations: ${sev.affects_integrations ? 'Yes' : 'No'}`,
              `- Causes charm error state: ${sev.causes_error_state ? 'Yes' : 'No'}`,
              `- Affects workload operations: ${sev.affects_workload ? 'Yes' : 'No'}`,
              `- Has workaround: ${sev.has_workaround ? 'Yes' : 'No'}`
            ].join('\n');

            const reproLine = analysis.steps_to_reproduce === 'not_applicable'
              ? null
              : `**Steps to reproduce:** ${analysis.steps_to_reproduce === 'present' ? 'Included' : 'Missing - please add reproduction steps'}`;

            const body = [
              MARKER,
              '## AI Pre-Analysis',
              '',
              analysis.summary,
              '',
              `**Complexity:** ${analysis.complexity}`,
              `**Confidence:** ${analysis.confidence} (${confidenceRange})`,
              `**Estimated effort:** ${pulseLabel}`,
              `**Auto-Resolve Eligible:** ${analysis.auto_resolve_eligible ? 'Yes' : 'No'}`,
              ...(reproLine ? [reproLine] : []),
              '',
              severityLines,
              '',
              '### Matching Historical Patterns',
              patternsMatched,
              '',
              '### Predicted Affected Areas',
              affectedAreas,
              '',
              '---',
              '*This analysis was automatically generated using repository-specific context.*',
              '*Context files: TRIAGING_RULES.md, REPO_PATTERNS.md, DECISION_HISTORY.json*',
              '',
              '**Human review recommended.** Override labels if AI assessment is incorrect - your corrections help improve future analyses.'
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }

      - name: Request Auto-Fix (if eligible)
        id: autofix
        uses: actions/github-script@v7
        env:
          ANALYSIS_B64: ${{ steps.analyze.outputs.analysis_b64 }}
        with:
          script: |
            const analysis = JSON.parse(Buffer.from(process.env.ANALYSIS_B64, 'base64').toString());
            const issueNumber = ${{ matrix.issue }};

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const currentLabels = issue.labels.map(l => l.name);
            const blockingLabels = ['security', 'breaking-change', 'no-ai-resolution', 'needs-discussion'];
            const isEligible =
              analysis.auto_resolve_eligible &&
              analysis.confidence === 'high' &&
              (analysis.complexity === 'trivial' || analysis.complexity === 'low') &&
              analysis.risk_level === 'low' &&
              !currentLabels.some(l => blockingLabels.includes(l));

            core.setOutput('eligible', String(isEligible));

            if (!isEligible) {
              console.log('Issue requires human review — skipping auto-resolve request');
              return;
            }

            // Swap labels: remove needs-human-review, add needs-copilot.
            // Ignore 404 — on re-runs the label may already be gone.
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'needs-human-review'
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['needs-copilot']
            });

