name: AI Bug Triaging

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze'
        required: true
        type: number

permissions:
  issues: write
  contents: read

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.action == 'opened')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Repository Context
        id: load_context
        run: |
          echo "Loading context files..."

          if [ ! -f .github/ai-context/TRIAGING_RULES.md ]; then
            echo "❌ TRIAGING_RULES.md not found"
            exit 1
          fi

          if [ ! -f .github/ai-context/REPO_PATTERNS.md ]; then
            echo "❌ REPO_PATTERNS.md not found"
            exit 1
          fi

          # Load context files
          RULES=$(cat .github/ai-context/TRIAGING_RULES.md)
          PATTERNS=$(cat .github/ai-context/REPO_PATTERNS.md)
          HISTORY=$(cat .github/ai-context/DECISION_HISTORY.json)

          # Save to output (handle multiline)
          echo "rules<<EOF" >> $GITHUB_OUTPUT
          echo "$RULES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "patterns<<EOF" >> $GITHUB_OUTPUT
          echo "$PATTERNS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "history<<EOF" >> $GITHUB_OUTPUT
          echo "$HISTORY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "✅ Context loaded successfully"

      - name: Get Issue Details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue?.number || ${{ github.event.inputs.issue_number || 0 }};
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            core.setOutput('number', issue.number);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || 'No description provided');
            core.setOutput('labels', JSON.stringify(issue.labels.map(l => l.name)));

            return issue;

      - name: Analyze Issue with AI
        id: analyze
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTEXT_RULES: ${{ steps.load_context.outputs.rules }}
          CONTEXT_PATTERNS: ${{ steps.load_context.outputs.patterns }}
          CONTEXT_HISTORY: ${{ steps.load_context.outputs.history }}
        with:
          script: |
            const issueTitle = `${{ steps.issue.outputs.title }}`;
            const issueBody = `${{ steps.issue.outputs.body }}`;
            const existingLabels = ${{ steps.issue.outputs.labels }};

            // Build context-aware prompt
            const prompt = `You are analyzing a bug for the Temporal Kubernetes Operator repository. Use the following repository-specific context to inform your analysis:

            === REPOSITORY TRIAGING RULES ===
            ${process.env.CONTEXT_RULES}

            === HISTORICAL PATTERNS ===
            ${process.env.CONTEXT_PATTERNS}

            === PAST TEAM CORRECTIONS ===
            ${process.env.CONTEXT_HISTORY}

            === NEW ISSUE TO ANALYZE ===
            Title: ${issueTitle}
            Body: ${issueBody}
            Existing Labels: ${existingLabels.join(', ')}

            Analyze this issue and respond ONLY with valid JSON (no markdown, no preamble):
            {
              "complexity": "trivial|low|medium|high|critical",
              "category": "operator|crd|k8s-integration|temporal|documentation|testing",
              "confidence": "high|medium|low",
              "priority": "highest|high|medium|low|lowest",
              "auto_resolve_eligible": true|false,
              "risk_level": "low|medium|high",
              "solution_approach": "Brief description of solution approach",
              "reasoning": "Why you chose these classifications",
              "context_rules_applied": ["List of rules from TRIAGING_RULES.md that influenced decision"],
              "similar_patterns": ["List of patterns from REPO_PATTERNS.md that match"],
              "affected_areas": ["Predicted files or components"],
              "recommended_assignee": "team or person based on code ownership"
            }`;

            // Call Anthropic API
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 2000,
                messages: [{
                  role: 'user',
                  content: prompt
                }]
              })
            });

            if (!response.ok) {
              const error = await response.text();
              core.setFailed(`API call failed: ${error}`);
              return;
            }

            const data = await response.json();
            const analysisText = data.content[0].text;

            // Parse JSON response (remove markdown if present)
            const cleanJson = analysisText.replace(/```json\n?|\n?```/g, '').trim();
            const analysis = JSON.parse(cleanJson);

            // Set outputs
            core.setOutput('complexity', analysis.complexity);
            core.setOutput('category', analysis.category);
            core.setOutput('confidence', analysis.confidence);
            core.setOutput('priority', analysis.priority);
            core.setOutput('auto_resolve', analysis.auto_resolve_eligible);
            core.setOutput('risk', analysis.risk_level);
            core.setOutput('analysis_json', JSON.stringify(analysis));

            console.log('Analysis complete:', analysis);
            return analysis;

      - name: Add AI Labels
        uses: actions/github-script@v7
        with:
          script: |
            const analysis = JSON.parse(`${{ steps.analyze.outputs.analysis_json }}`);
            const issueNumber = ${{ steps.issue.outputs.number }};

            const labels = [
              `ai-complexity:${analysis.complexity}`,
              `ai-category:${analysis.category}`,
              `ai-confidence:${analysis.confidence}`,
              `ai-priority:${analysis.priority}`,
              `ai-risk:${analysis.risk_level}`
            ];

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: labels
            });

            console.log(`Added labels: ${labels.join(', ')}`);

      - name: Post AI Analysis Comment
        uses: actions/github-script@v7
        with:
          script: |
            const analysis = JSON.parse(`${{ steps.analyze.outputs.analysis_json }}`);
            const issueNumber = ${{ steps.issue.outputs.number }};

            const autoResolveEmoji = analysis.auto_resolve_eligible ? '✅' : '🚫';

            const comment = `## 🤖 AI Pre-Analysis (Context-Aware)

            **Complexity:** ${analysis.complexity}
            **Category:** ${analysis.category}
            **Confidence:** ${analysis.confidence} (${analysis.confidence === 'high' ? '90%+' : analysis.confidence === 'medium' ? '60-90%' : '<60%'})
            **Priority Recommendation:** ${analysis.priority}
            **Risk Level:** ${analysis.risk_level}
            **Auto-Resolve Eligible:** ${autoResolveEmoji} ${analysis.auto_resolve_eligible ? 'Yes' : 'No'}

            ### Applied Repository Rules
            ${analysis.context_rules_applied.map(rule => `- ✅ ${rule}`).join('\n')}

            ### Matching Historical Patterns
            ${analysis.similar_patterns.length > 0 ? analysis.similar_patterns.map(pattern => `- 🔍 ${pattern}`).join('\n') : '- No exact pattern match (new pattern type)'}

            ### Solution Approach
            ${analysis.solution_approach}

            ### Reasoning
            ${analysis.reasoning}

            ### Predicted Affected Areas
            ${analysis.affected_areas.map(area => `- \`${area}\``).join('\n')}

            ${analysis.recommended_assignee ? `### Recommended Assignee\n@${analysis.recommended_assignee}\n` : ''}

            ---
            *This analysis was automatically generated using repository-specific context.*
            *Context files: TRIAGING_RULES.md, REPO_PATTERNS.md, DECISION_HISTORY.json*

            **Human review recommended.** Override labels if AI assessment is incorrect - your corrections help improve future analyses.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

      - name: Check Auto-Resolve Eligibility
        id: check_auto_resolve
        uses: actions/github-script@v7
        with:
          script: |
            const analysis = JSON.parse(`${{ steps.analyze.outputs.analysis_json }}`);
            const issueNumber = ${{ steps.issue.outputs.number }};

            // Get current labels
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const labels = issue.labels.map(l => l.name);

            // Safety checks
            const blockingLabels = ['security', 'breaking-change', 'no-ai-resolution', 'needs-discussion'];
            const hasBlockingLabel = labels.some(l => blockingLabels.includes(l));

            const isEligible =
              analysis.auto_resolve_eligible &&
              analysis.confidence === 'high' &&
              (analysis.complexity === 'trivial' || analysis.complexity === 'low') &&
              analysis.risk_level === 'low' &&
              !hasBlockingLabel;

            core.setOutput('eligible', isEligible);

            if (isEligible) {
              console.log('✅ Issue is eligible for auto-resolution');
            } else {
              console.log('❌ Issue requires human review');
              console.log(`Reasons: confidence=${analysis.confidence}, complexity=${analysis.complexity}, risk=${analysis.risk_level}, blocking_labels=${hasBlockingLabel}`);
            }

            return isEligible;

      - name: Request Copilot Auto-Fix (if eligible)
        if: steps.check_auto_resolve.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const analysis = JSON.parse(`${{ steps.analyze.outputs.analysis_json }}`);
            const issueNumber = ${{ steps.issue.outputs.number }};

            const comment = `## 🤖 Auto-Resolution Request

            This issue has been identified as eligible for automatic resolution.

            **Proposed Approach:**
            ${analysis.solution_approach}

            **Safety Checks Passed:**
            - ✅ High confidence (${analysis.confidence})
            - ✅ Low complexity (${analysis.complexity})
            - ✅ Low risk (${analysis.risk_level})
            - ✅ No blocking labels
            - ✅ Matches auto-resolve patterns

            @copilot please fix this issue following the solution approach above.

            **Requirements:**
            - Keep changes minimal and focused
            - Run all tests before creating PR
            - Add tests if needed
            - Follow existing code style
            - Update documentation if needed

            Once fixed, create a PR with prefix \`[AI-Auto]\` in the title and reference this issue.

            ---
            *A team member will review the PR before merge.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

            // Add label to track auto-resolution attempt
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['auto-resolution-requested']
            });

      - name: Summary
        run: |
          echo "## Analysis Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Issue #${{ steps.issue.outputs.number }} has been analyzed using repository context." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Complexity: ${{ steps.analyze.outputs.complexity }}" >> $GITHUB_STEP_SUMMARY
          echo "- Category: ${{ steps.analyze.outputs.category }}" >> $GITHUB_STEP_SUMMARY
          echo "- Priority: ${{ steps.analyze.outputs.priority }}" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-resolve: ${{ steps.check_auto_resolve.outputs.eligible }}" >> $GITHUB_STEP_SUMMARY
